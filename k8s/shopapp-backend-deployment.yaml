apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopapp-backend
  labels:
    app: shopapp-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopapp-backend
  template:
    metadata:
      labels:
        app: shopapp-backend
    spec:
      containers:
        - name: shopapp-backend
          image: harsh042/shopapp-backend:v2.0.0
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: REDIS_HOST
              value: "shopapp-redis"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
