apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopapp-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - harshalxz.3utilities.com
      secretName: shopapp-tls

  rules:
    - host: harshalxz.3utilities.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: shopapp-backend-service
                port:
                  number: 5000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopapp-frontend-service
                port:
                  number: 80
