apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopapp-redis
  labels:
    app: shopapp-redis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopapp-redis
  template:
    metadata:
      labels:
        app: shopapp-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
