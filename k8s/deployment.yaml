apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopapp
  labels:
    app: shopapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopapp
  template:
    metadata:
      labels:
        app: shopapp
    spec:
      containers:
        - name: shopapp
          image: harsh042/shopapp:v1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
